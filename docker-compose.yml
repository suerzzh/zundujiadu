version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Internal only: Nginx proxies /api to this service
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./workspace:/app/workspace
      - ./novel2script.db:/app/novel2script.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

